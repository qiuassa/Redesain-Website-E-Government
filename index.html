<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi Pemerintah Kabupaten Brebes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <header class="navbar">
            <div class="logo-container">
                <img class="logo-img" src="./assets/logo-brebes.webp" alt="Lambang Kabupaten Brebes">
                <span class="tag-kabupaten">KABUPATEN BREBES</span>
            </div>

            <nav class="nav-menu" aria-label="Navigasi utama">
                <a href="#mengenal" class="nav-item active">MENGENAL BREBES <span class="chevron" aria-hidden="true"></span></a>
                <a href="#layanan" class="nav-item">LAYANAN PUBLIK <span class="chevron" aria-hidden="true"></span></a>
                <a href="#informasi" class="nav-item">INFORMASI PUBLIK <span class="chevron" aria-hidden="true"></span></a>
                <a href="#transparansi" class="nav-item">TRANSPARANSI <span class="chevron" aria-hidden="true"></span></a>
            </nav>

            <div class="toggle-container">
                <button class="toggle-switch" id="theme-toggle" type="button" aria-label="Aktifkan mode gelap" aria-pressed="false"></button>
            </div>
        </header>

        <main class="hero-container" id="mengenal">
            <h1 class="brand-title">BREBES</h1>

            <div class="subtitle-divider">
                <span class="line"></span>
                <p class="subtitle-text">PORTAL RESMI PEMERINTAH KABUPATEN BREBES</p>
                <span class="line"></span>
            </div>

            <form class="search-bar" action="https://www.google.com/search" method="get" role="search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.3" />
                    <path d="m16 16 4.5 4.5" />
                </svg>
                <input type="search" name="q" aria-label="Cari informasi" placeholder="Cari layanan, transparansi, informasi publik daerah Brebes...">
                <button class="btn-cari" type="submit">CARI</button>
            </form>

            <div class="gallery-cards">
                <div class="card card-left-outer">
                    <img src="./assets/gedung-ilustrasi.jpg" alt="Ilustrasi gedung Kementerian BUMN di Jakarta">
                    <div class="card-info">
                        <span class="card-tag">ILUSTRASI PEMERINTAHAN</span>
                        <h4 class="card-name">GEDUNG KPT BREBES</h4>
                    </div>
                </div>

                <div class="card card-left-inner">
                    <img src="./assets/monumen-ilustrasi.jpg" alt="Ilustrasi tugu Monas di Jakarta">
                    <div class="card-info">
                        <span class="card-tag">ILUSTRASI LANDMARK</span>
                        <h4 class="card-name">TUGU BAWANG BREBES</h4>
                    </div>
                </div>

                <div class="card card-right-inner">
                    <img src="./assets/kebun-teh-kaligua.jpg" alt="Hamparan perkebunan teh Kaligua di Brebes">
                    <div class="card-info">
                        <span class="card-tag">WISATA ALAM</span>
                        <h4 class="card-name">KEBUN TEH KALIGUA</h4>
                    </div>
                </div>

                <div class="card card-right-outer">
                    <img src="./assets/curug-ilustrasi.jpg" alt="Ilustrasi Curug Sewu, air terjun di Jawa Tengah">
                    <div class="card-info">
                        <span class="card-tag">ILUSTRASI AIR TERJUN</span>
                        <h4 class="card-name">CURUG PUTRI</h4>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./theme.js" defer></script>
</body>
</html>
